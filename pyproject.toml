[project]
name = "canvas-automation"
version = "0.1.0"
description = "Local .command-driven tools for scripting Canvas (Instructure) content creation."
license = "MIT"
requires-python = ">=3.9"
dependencies = [
    "flask>=3.0,<4.0",
    "requests>=2.31,<3.0",
    "pypdf>=4.0",
    "reportlab>=4.0",
    "beautifulsoup4>=4.12",
    "openpyxl>=3.1",
    "lxml>=5.0,<7.0",
    "waitress>=3.0,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
canvas-automation = "canvas_automation.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/canvas_automation"]
